<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>MONT33</title>
    <style>
        :root {
            color-scheme: dark;
            background: #000;
            color: #fff;
            font: 1rem/1.5 "Courier Prime", "Courier New", monospace;
        }

        body {
            margin: 0;
            padding: clamp(1rem, 5vw, 3rem);
        }

        .terminal-line {
            display: flex;
            margin: 0;
            white-space: nowrap;
        }

        .return-home {
            position: absolute;
            top: .75rem;
            right: clamp(1rem, 4vw, 2.5rem);
            display: inline-grid;
            place-items: center;
            min-height: 44px;
            padding-inline: .75rem;
            border: 1px solid #555;
            border-radius: .35rem;
            color: inherit;
            font-size: .875rem;
            text-decoration: none;
        }

        .return-home:hover { background: #171717; }

        main { padding-top: 3.5rem; }

        @media (prefers-reduced-motion: no-preference) {
            .terminal-message {
                overflow: hidden;
                animation: type 1.2s steps(14, end) .2s both;
            }

            .terminal-cursor {
                animation: blink 1s step-end 1.4s infinite;
            }
        }

        @keyframes type {
            from { width: 0; }
            to { width: 14ch; }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <a class="return-home" href="../">Return home</a>
    <main>
        <p class="terminal-line"><span class="terminal-message">Coming soon...</span><span class="terminal-cursor" aria-hidden="true">|</span></p>
    </main>
</body>
</html>
