<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#01043a">
    <title>McCorbinMADE</title>
    <style>
        :root {
            color-scheme: dark;
            background: #01043a;
            color: #fff1df;
            font-family: "Courier Prime", "Courier New", monospace;
        }

        body {
            position: relative;
            overflow: clip;
            margin: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            position: relative;
            z-index: 2;
            display: flex;
            padding: clamp(1rem, 4vw, 2.5rem);
        }

        .site-header nav {
            display: flex;
            flex-wrap: wrap;
            column-gap: 1.25rem;
        }

        .nav-dropdown {
            position: relative;
            z-index: 1;
        }

        .nav-dropdown summary,
        .nav-dropdown a {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding-inline: .75rem;
            color: inherit;
            text-decoration: none;
        }

        .nav-dropdown summary {
            gap: .5rem;
            cursor: pointer;
            font-weight: 600;
            list-style: none;
        }

        .nav-dropdown summary::-webkit-details-marker {
            display: none;
        }

        .nav-dropdown summary::after {
            content: "";
            width: .35em;
            height: .35em;
            border-right: 1px solid currentColor;
            border-bottom: 1px solid currentColor;
            transform: translateY(-.12em) rotate(45deg);
        }

        .nav-dropdown[open] summary::after {
            transform: translateY(.12em) rotate(225deg);
        }

        .dropdown-panel {
            position: absolute;
            inset: calc(100% + .25rem) -.25rem auto;
            min-height: 44px;
            border-radius: .45rem;
            background: #191e53;
            font-size: .875rem;
        }

        .nav-dropdown summary:hover,
        .nav-dropdown a:hover {
            color: #83deff;
        }

        @media (prefers-reduced-motion: no-preference) {
            @supports selector(details::details-content) and (transition-behavior: allow-discrete) {
                .nav-dropdown::details-content {
                    position: absolute;
                    inset: calc(100% + .25rem) -.25rem auto;
                    clip-path: inset(0 0 100% 0 round .45rem);
                    transition: clip-path 240ms ease, content-visibility 240ms allow-discrete;
                }

                .nav-dropdown[open]::details-content {
                    clip-path: inset(0 0 0 0 round .45rem);
                }

                .nav-dropdown .dropdown-panel {
                    position: static;
                }

                .nav-dropdown summary::after {
                    transition: transform 240ms ease;
                }

                .nav-dropdown:not([open]) a {
                    pointer-events: none;
                }

                .nav-dropdown a:focus-visible {
                    outline-offset: -4px;
                }
            }
        }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: grid;
            justify-items: center;
            align-content: center;
            padding: 3.75rem clamp(1rem, 5vw, 4rem) clamp(4rem, 12vh, 8rem);
        }

        .featured-projects {
            position: absolute;
            inset: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: .25rem 1.5rem;
            padding-inline: 1rem;
            font-size: clamp(.875rem, 2vw, 1.125rem);
            text-align: center;
        }

        .featured-projects a {
            padding: .5rem .65rem;
            border-radius: .35rem;
            background: #01043a;
            color: inherit;
            text-underline-offset: .25em;
        }

        .featured-projects .lore-link {
            color: #ff65e5;
            font-weight: 700;
        }

        .wordmark {
            display: block;
            width: min(100%, 65rem);
            height: auto;
        }

        .reaching-hand {
            --hand-angle: 25deg;
            position: absolute;
            bottom: -7svh;
            left: min(5vw, 5svh, 4rem);
            height: 87svh;
            width: auto;
            transform-origin: 59% 98%;
            transform: translateX(-59%) rotate(var(--hand-angle)) scaleX(-1);
            pointer-events: none;
        }

        @media (min-aspect-ratio: 3/4) {
            .reaching-hand { --hand-angle: 38deg; }
        }

        @media (min-aspect-ratio: 4/3) {
            .reaching-hand { height: 97svh; }
        }

        :focus-visible {
            outline: 2px solid #83deff;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <nav aria-label="Main navigation">
            <details class="nav-dropdown" name="homepage-menu">
                <summary>Projects</summary>
                <div class="dropdown-panel">
                    <a href="https://lore.mccorbinmade.com/">LORE</a>
                </div>
            </details>
            <details class="nav-dropdown" name="homepage-menu">
                <summary>Events</summary>
                <div class="dropdown-panel"></div>
            </details>
        </nav>
    </header>

    <img class="reaching-hand" src="homepage-images/reaching-hand.png" width="1055" height="1491" alt="">

    <main>
        <div class="featured-projects">
            <a class="lore-link" href="https://lore.mccorbinmade.com/">LORE App</a>
            <a href="mont33/">MONT33 (Coming soon)</a>
        </div>
        <img class="wordmark" src="homepage-images/mccorbinmade-logo.png" width="4544" height="1764" alt="McCorbinMADE">
    </main>
</body>
</html>
